<div class=" duration-0 text-white" 
[class.bg-[#2B2F38]]="mode() != 'claire'"
[class.bg-[#FCFBFC]]="mode() == 'claire'">
    <app-nav [nav]="'projets'" [src]="src" (mode)="modeDark($event)"></app-nav>

    <div class="text-6xl font-bold mt-32 text-center max-sm:text-4xl max-sm:mt-20 projets" [class.text-[#2B2F38]]="mode() == 'claire'">
        Projets
    </div>

    @if (skill() == 'ux') {
        <div id="basculer" class="w-[124px] h-[40px] outline outline-[1px] outline-[#7E452B] rounded-full mt-10 mx-auto flex">
            <div id="fond" class="w-[62px] h-[40px] bg-[#7E452B] rounded-full absolute z-0 duration-200">
            </div>
            <div 
              id="ux" 
              class="w-[62px] h-full rounded-full text-center text-2xl text-[#fff] font-semibold flex flex-col justify-center z-20 cursor-pointer"
              (click)="basculerUX()" 
              [class.text-black]="mode()=='claire' && User() == projetsUi()"
              >
                UX
            </div>
            <div 
              id="ui" 
              class="w-[62px] h-full rounded-full text-center text-2xl  font-semibold flex flex-col justify-center z-20 cursor-pointer"
              (click)="basculerUI()"
              [class.text-black]="mode()=='claire' && User() == projetsUx()"
            >
                UI
            </div>
        </div>
        <div class="max-[1080px]:w-full w-[1078px] justify-self-center">
            <div class="grid grid-cols-[347px_347px_347px]  max-[1080px]:grid-cols-[347px] justify-between  max-[1080px]:justify-center mt-[50px]   max-sm:w-full max-sm:gap-8   overflow-hidden" >
                @for (item of User(); track item.numb) {
                    @if (User() == projetsUx()) {
                    <div [id]="item.idName" class="carteProjets border-[1px] border-[#7E452B] mt-6  w-[347px] h-[474px]  rounded-[42px] mx-auto  hover:shadow-ombre2 duration-500 max-sm:w-[304px] max-sm:h-[442px] overflow-hidden max-sm:rounded-[42px] " [class.text-white]="mode()!='claire'" [class.text-black]="mode()=='claire'">                        
                        <div class="px-[9px] py-[9px] w-full  ">
                            <div class="rounded-[33px]  overflow-hidden">
                                <img [ngSrc]="item.img" [alt]="item.nom" width="390" height="292">
                            </div>
                        </div>
                        <div class="text-[#2B2F38] mt-[24px] text-2xl font-bold text-center max-sm:mt-4 max-sm:text-xl max-sm:font-semibold"
                        [class.text-white]="mode()!='claire'">
                            {{item.nom}}
                        </div>
                        <div class="w-[310px] font-normal mx-auto my-[18px] max-sm:text-sm max-sm:font-extralight max-sm:mt-[8px] max-sm:mb-[17.5px] max-sm:w-[235px]">
                            {{item.description}}
                        </div>
                        <div class="flex justify-center">
                            <a [href]="item.behance" target="_blank" rel="noopener noreferrer"
                               class="group z-20 inline-flex items-center gap-2 h-[40px] pl-5 pr-2 rounded-full bg-[#7E452B] text-white text-sm font-semibold
                                      hover:scale-[105%] hover:shadow-ombre2 duration-300 cursor-pointer max-sm:h-[37px] max-sm:text-xs">
                                Voir le projet
                                <span class="flex items-center justify-center w-[28px] h-[28px] rounded-full bg-white/15
                                             group-hover:bg-white/25 duration-300">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                                         class="group-hover:translate-x-[2px] duration-300">
                                        <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="white" stroke-width="2"
                                              stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                            </a>
                        </div>
                        <div class="flex justify-between">
                            <div class=" w-[44px] h-[41px] rounded-bl-[42px] rounded-tr-[42px] bg-[#7E452B]"></div>
                            <div class="w-[44px] h-[41px] rounded-tl-[42px] rounded-br-[42px] bg-[#7E452B]"></div>
                        </div>
                    </div>}@else{
                    <div [id]="item.idName" class="carteProjets border-[1px] border-[#7E452B] mt-6  w-[347px] h-[474px]  rounded-[42px] mx-auto  hover:shadow-ombre2 duration-500 max-sm:w-[304px] max-sm:h-[442px] overflow-hidden max-sm:rounded-[42px] " [class.text-white]="mode()!='claire'" [class.text-black]="mode()=='claire'">                        
                        <div class="px-[9px] py-[9px] w-full  ">
                            <div class="rounded-[33px]  overflow-hidden">
                                <img [ngSrc]="item.img" [alt]="item.nom" width="390" height="292">
                            </div>
                        </div>
                        <div class="text-[#2B2F38] mt-[24px] text-2xl font-bold text-center max-sm:mt-4 max-sm:text-xl max-sm:font-semibold"
                        [class.text-white]="mode()!='claire'">
                            {{item.nom}}
                        </div>
                        <div class="w-[310px] font-normal mx-auto my-[18px] max-sm:text-sm max-sm:font-extralight max-sm:mt-[8px] max-sm:mb-[17.5px] max-sm:w-[235px]">
                            {{item.description}}
                        </div>
                        <div class="flex justify-center">
                            <a [href]="item.behance" target="_blank" rel="noopener noreferrer"
                               class="group z-20 inline-flex items-center gap-2 h-[40px] pl-5 pr-2 rounded-full bg-[#7E452B] text-white text-sm font-semibold
                                      hover:scale-[105%] hover:shadow-ombre2 duration-300 cursor-pointer max-sm:h-[37px] max-sm:text-xs">
                                Voir le projet
                                <span class="flex items-center justify-center w-[28px] h-[28px] rounded-full bg-white/15
                                             group-hover:bg-white/25 duration-300">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                                         class="group-hover:translate-x-[2px] duration-300">
                                        <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="white" stroke-width="2"
                                              stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                            </a>
                        </div>
                        <div class="flex justify-between">
                            <div class=" w-[44px] h-[41px] rounded-bl-[42px] rounded-tr-[42px] bg-[#7E452B]"></div>
                            <div class="w-[44px] h-[41px] rounded-tl-[42px] rounded-br-[42px] bg-[#7E452B]"></div>
                        </div>
                    </div>
                    }
                }
            </div>
        </div>

    }
    
    <app-footer [ambiance]="mode()"></app-footer>
</div>
